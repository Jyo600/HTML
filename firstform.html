<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirstForm</title>
</head>
<body>
    <form>
        <label>Name:</label>
        <input type="text" name="username">
        <br><br>
        <label>Age:</label>
        <input type="number" name="userAge">
        <br><br>
        <label>Password:</label>
        <input type="password" name="userpassword">
        <br><br>
        <label for="male">male</label>
        <input type="radio" name="user gender" value="male">
        <label for="female">Female</label>
        <input type="radio" name="user gender" value="female">
        <label for="other">other</label>
        <input type="radio" name="user gender" value="other">
        <br><br>
        <label for="c++">c++</label>
        <input type="checkbox" name="subject" id="c++">
        <label for="java">java</label>
        <input type="checkbox" name="subject" id="java">
        <label for="python">python</label>
        <input type="checkbox" name="subject" id="python">
        <label for="MangoDB">MangoDB</label>
        <input type="checkbox" name="subject" id="MangoDB">
        <br><br>
        <input type="submit"
    </form>
    
</body>
</html>
